---
name: pull_request_target

on:
  pull_request_target:

jobs:
  assign-author-to-pr:
    name: Assign Author to PR
    if: ${{ !endswith(github.actor, '[bot]') && (github.event.action == 'opened' || github.event.action == 'reopened') }}
    runs-on: ubuntu-latest
    steps:
      - uses: technote-space/assign-author@9558557c5c4816f38bd06176fbc324ba14bb3160 # v1.6.2
  enforce-branch-name:
    name: Enforce Branch Name
    runs-on: ubuntu-latest
    steps:
      - name: 💂 Enforce Branch Name
        uses: finleyfamily/action-enforce-branch-name@27f7c2a8a81b14def3b2d6504a506444da3abdc8 # v1.0.2
        with:
          allowed_prefixes: >-
            bugfix,chore,dep,depend,dependabot,deps,docs,feat,feature,fix,hotfix,
            maint,maintain,maintenance,pre-commit,release,renovate,snyk
  label-pr:
    name: Label PR
    if: ${{ github.event.action == 'opened' || github.event.action == 'reopened' || github.event.action == 'synchronize' }}
    permissions:
      contents: write
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - name: 🚀 Run Release Drafter
        uses: release-drafter/release-drafter@6a93d829887aa2e0748befe2e808c66c0ec6e4c7 # v6.4.0
        with:
          disable-releaser: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
